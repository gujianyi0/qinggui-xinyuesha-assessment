name: local-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend tests migrations scripts/local_demo.py scripts/prepare_embedding.py scripts/prepare_native_kafka.py scripts/verify_native_kafka.py scripts/verify_embeddings.py scripts/prepare_native_postgres.py scripts/verify_native_postgres.py scripts/verify_compose.py scripts/backup_native_database.py scripts/fingerprint_database.py scripts/docker_live.py scripts/restore_docker_database.py scripts/verify_docker_cutover.py scripts/public_service.py scripts/prepare_public_service.py scripts/deploy_public_entry.py scripts/verify_public_service.py scripts/verify_public_recovery.py scripts/backup_docker_primary.py scripts/isolated_real_eval.py scripts/prepare_isolated_eval.py scripts/verify_restored_service.py
      - run: uv run pytest -q
      - run: uv run ruff check evaluations/run.py scripts/verify_browser_request_recovery.py scripts/verify_runtime_source.py
      - name: Verify migration roundtrip on a disposable database
        env:
          DATABASE_URL: sqlite+aiosqlite:///migration-check.sqlite3
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  public-entry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-entry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public-entry/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
