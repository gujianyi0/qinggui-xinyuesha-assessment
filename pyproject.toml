[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qinggui-xinyuesha-assessment"
version = "1.2.0"
description = "新月杀资料、已验证裁定与反馈助手"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.14,<2",
  "agno>=2.3,<3", "openai>=1.65,<4", "httpx>=0.28,<1",
  "redis>=5.2,<8", "confluent-kafka>=2.8,<3", "pgvector>=0.3,<1",
  "websockets>=14,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
embeddings = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
include = ["backend*", "integrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
